  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Offline — Hone</title>
    <!--
      Served by the service worker when a navigation fails while offline.
      Self-contained on purpose (no external CSS/JS/images), because it is
      returned for arbitrary URLs and relative assets would not resolve.
      Colors come from src/index.css (paper-white, ink-black, jade, jade-mist).
    -->
    <style>
      :root {
        --paper-white: #ffffff;
        --ink-black: #17191c;
        --text-muted: #6d6661;
        --jade: #0b8b73;
        --jade-deep: #076351;
        --jade-mist: #dff5ee;
        --border-subtle: rgba(23, 19, 17, 0.08);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background: var(--paper-white);
        color: var(--ink-black);
        font-family:
          Manrope,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      img {
        display: block;
        margin: 0 auto;
        width: 56px;
        height: 56px;
      }
      .status {
        display: inline-block;
        margin: 20px 0 0;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--jade-mist);
        color: var(--jade-deep);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 {
        margin: 14px 0 8px;
        font-family: "Instrument Serif", ui-serif, Georgia, serif;
        font-size: 34px;
        font-weight: 400;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--text-muted);
        font-size: 15px;
        line-height: 1.6;
      }
      button {
        margin-top: 28px;
        height: 44px;
        padding: 0 20px;
        border: 1px solid var(--jade);
        border-radius: 12px;
        background: var(--jade);
        color: #fdfbf8;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(11, 139, 115, 0.2);
      }
      button:hover {
        background: var(--jade-deep);
        border-color: var(--jade-deep);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(11, 139, 115, 0.35);
      }
    </style>
  </head>
